<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1565c0"><link rel="manifest" href="manifest.webmanifest"><title>Aqua Super SMS Gateway</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f8fc;color:#123}main{max-width:520px;margin:auto;padding:24px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px #0001}h1{font-size:24px}input,textarea,button{width:100%;box-sizing:border-box;margin-top:10px;padding:13px;border-radius:10px;border:1px solid #ccd5e0;font-size:16px}button{background:#1565c0;color:#fff;border:0;font-weight:700}.secondary{background:#e8f0fb;color:#1565c0}.ok{color:#16733a}.warn{color:#9a6500}</style></head><body><main><div class="card"><h1>📱 Aqua Super SMS Gateway</h1><p>This phone-side PWA prepares SMS requests for Aqua Super.</p><label>Customer mobile</label><input id="phone" inputmode="tel" placeholder="10 digit mobile"><label>Message</label><textarea id="message" rows="6" placeholder="Type test SMS"></textarea><button id="send">Open SMS</button><button class="secondary" id="copy">Copy SMS link</button><p id="status" class="ok"></p><hr><p class="warn"><b>Important:</b> A normal PWA cannot silently send SMS through the SIM. Android allows this PWA to open the SMS composer; automatic background SIM sending requires an Android bridge.</p></div></main><script>const phone=document.getElementById('phone'),message=document.getElementById('message'),status=document.getElementById('status');function link(){let p=phone.value.replace(/\D/g,'');if(p.length===10)p='91'+p;return 'sms:'+p+'?body='+encodeURIComponent(message.value)}document.getElementById('send').onclick=()=>{if(phone.value.replace(/\D/g,'').length<10){status.textContent='Enter a valid mobile number.';return}location.href=link();status.textContent='SMS composer opened.'};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(link());status.textContent='SMS link copied.'}catch(e){status.textContent='Copy failed.'}};</script></body></html>
