name: Build Aqua Super SMS Gateway
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create temporary release signing key
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/aqua-signing"
          KEYSTORE="$RUNNER_TEMP/aqua-signing/aqua-super-release.jks"
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -v             -keystore "$KEYSTORE"             -storepass "$PASS"             -keypass "$PASS"             -alias aqua-super             -keyalg RSA             -keysize 2048             -validity 3650             -dname "CN=Aqua Super, OU=SMS Gateway, O=Aqua Super, L=Asansol, ST=West Bengal, C=IN"
          echo "AQUA_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "AQUA_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "AQUA_KEY_ALIAS=aqua-super" >> "$GITHUB_ENV"
          echo "AQUA_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle assembleRelease

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: aqua-super-sms-gateway-release
          path: app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: aqua-super-sms-gateway-debug
          path: app/build/outputs/apk/debug/app-debug.apk